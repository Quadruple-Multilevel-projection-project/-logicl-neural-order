name: source-check-smoke
on:
  push:
    paths:
      - "experiment/**"
      - ".github/workflows/smoke.yml"
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python experiment/check.py
